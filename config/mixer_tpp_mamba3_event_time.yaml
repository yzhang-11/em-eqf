# Mamba3 event-time decay profile. Direct log(delta_t) is masked by default.
# Current Mamba3 default: decay_only + native phase + no direct delta_t.
# User default: legacy time head; residual connections disabled.
# Input ablation and structural time channels are independent.
provide_physical_dt: true
mask_input_features: [log_inter_times]  # Set [] to restore direct delta_t content.
model: mixer_tpp
num_event_types: 1
pad_token_id: 1
task_type: tpp
batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 0.0003
weight_decay: 0.01
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1.0e-06
scheduler_type: hf_cosine
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8
use_amp: false
dropout: 0.1
d_model: 64
mixer_model_config:
  input_dim: 2
  dropout_prob: 0.1
  d_model: 64
  n_layer: 2
  d_intermediate: 128
  input_proj_type: mlp
  input_proj_hidden: 128
  input_proj_activation: silu
  input_proj_dropout: 0.1
  input_init: kaiming_uniform
  input_init_scale: 1.5
  attn_layer_idx: []
  ssm_cfg:
    layer: Mamba3EventTime
    rope_fraction: 0.5
    rotary_emb_base: 10000.0
    chunk_size: 16
    is_mimo: true
    mimo_rank: 2
    d_state: 64
    headdim: 32
    expand: 2
    time_update_mode: decay_only
    use_event_time_phase: false
  attn_cfg:
    layer: MHATime
    num_heads: 4
    rotary_emb_dim: 8
    rotary_emb_scale_base: 8192
    causal: true
  norm_epsilon: 1.0e-05
  rms_norm: false
  initializer_cfg:
    initializer_range: 0.02
  fused_add_norm: false
  residual_in_fp32: true
  use_residual: false
num_components: 32
dim: 1
epochs: 1500
save_dir: null
cuda_id: '0'
dataset: SCEDC
seed: 0
minibatch_training: false
split_by_time: true
use_all_data: false
time_order:
- train
- val
- test
features_input_keys:
- mag
- log_inter_times
normalize_time_by_token: true
time_scale_base_key: tau_mean
predict_b: true
use_ssm_filter: false
B_range:
- 0.0001
- 0.01
use_b_updater: false
use_adaptive_loss_weights: false
b_updater_cfg:
  delta: 0.998
  a0: 50
  init_b_target: 1
loss_weights:
  time_weight: 1.0
  mag_weight: 1.0
  b_weight: 0.0
  b_smooth_weight: 0.0
loss_reduction: per_event
b_range:
- 0.2
- 2
Mc: 2.0
resume_path: null
load_specific_parts: []
save_epochs: []
use_double_precision: false
mixer_time_parametrization: legacy
event_drop_prob: 0.0
