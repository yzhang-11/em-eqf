# Mamba2Rotary TPP with event-time RoPE and xPos scaling.
model: mixer_tpp
num_event_types: 1
pad_token_id: 1
task_type: tpp
batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 0.001
weight_decay: 1.0e-05
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1.0e-06
scheduler_type: hf_cosine
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8
dropout: 0.3
d_model: 64
mixer_model_config:
  input_dim: 2
  dropout_prob: 0.1
  d_model: 64
  n_layer: 1
  d_intermediate: 128
  attn_layer_idx: []
  input_proj_type: mlp
  input_proj_hidden: 128
  input_proj_activation: silu
  input_proj_dropout: 0.1
  input_init: kaiming_uniform
  input_init_scale: 1.5
  ssm_cfg:
    layer: Mamba2Rotary
    d_state: 64
    expand: 2
    headdim: 32
    use_conv: false
    rotary_emb_scale_base: 8192
    chunk_size: 256
  attn_cfg:
    layer: MHA
    num_heads: 4
    rotary_emb_dim: 8
    rotary_emb_scale_base: 2048
    causal: true
  norm_epsilon: 1.0e-05
  rms_norm: false
  initializer_cfg:
    initializer_range: 0.02
  fused_add_norm: false
  residual_in_fp32: true
num_components: 32
dim: 1
epochs: 3000
save_dir: null
cuda_id: '0'
dataset: SCEDC
seed: 0
minibatch_training: false
split_by_time: true
time_order:
- train
- val
- test
features_input_keys:
- mag
- log_inter_times
normalize_time_by_token: true
time_scale_base_key: tau_mean
predict_b: true
use_ssm_filter: false
use_b_updater: false
use_adaptive_loss_weights: false
b_updater_cfg:
  delta: 0.98
  a0: 50
  init_b_target: 1
loss_weights:
  time_weight: 1
  mag_weight: 1
  b_weight: 0.01
  b_smooth_weight: 0.001
loss_reduction: per_time
b_range:
- 0.2
- 2
resume_path: null
load_specific_parts: []
